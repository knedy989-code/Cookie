<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cookie RNG: Infinite Crumb</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d0d0d; color: white; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .cookie-shadow { filter: drop-shadow(0 0 20px rgba(251, 191, 36, 0.2)); }
        .cookie-click:active { transform: scale(0.9); }
        .rarity-card { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .divine-glow { box-shadow: 0 0 15px #06b6d4; border: 1px solid #06b6d4; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header class="p-6 bg-[#121212] border-b border-white/5 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-black text-amber-500 tracking-tighter uppercase">Infinite Crumb</h1>
            <p class="text-xs font-mono text-gray-500">BITS: <span id="bits" class="text-white">0</span></p>
        </div>
        <div id="luck-tag" class="bg-amber-500/10 border border-amber-500/20 px-3 py-1 rounded-full text-[10px] font-bold text-amber-500">
            LUCK: 1.0x
        </div>
    </header>

    <main id="tab-roll" class="flex-grow flex flex-col items-center justify-center p-8">
        <div id="main-cookie" class="text-[120px] cursor-pointer select-none transition-transform cookie-click cookie-shadow mb-12">
            🍪
        </div>
        
        <button id="roll-button" class="w-full max-w-xs bg-amber-600 hover:bg-amber-500 text-white font-black py-4 rounded-2xl shadow-lg active:scale-95 transition-all">
            SUMMON COOKIE
        </button>
        <p class="mt-4 text-[10px] text-gray-600 uppercase tracking-widest font-bold">Cost: 0 Bits</p>
    </main>

    <main id="tab-inv" class="hidden flex-grow p-6 overflow-y-auto">
        <h2 class="text-xl font-bold mb-6 text-gray-400">YOUR STASH</h2>
        <div id="inv-list" class="space-y-3">
            </div>
    </main>

    <main id="tab-shop" class="hidden flex-grow p-6">
        <h2 class="text-xl font-bold mb-6 text-gray-400">UPGRADES</h2>
        <div onclick="buyUpgrade()" class="bg-[#181818] p-4 rounded-2xl border border-white/5 flex justify-between items-center active:bg-zinc-800">
            <div>
                <h3 class="font-bold text-amber-500 text-sm">Magic Oven</h3>
                <p class="text-[10px] text-gray-500">Increases Luck by +0.5x</p>
            </div>
            <div id="upgrade-cost" class="bg-amber-600 px-4 py-2 rounded-lg font-bold text-xs">50 BITS</div>
        </div>
    </main>

    <nav class="bg-[#121212] border-t border-white/5 flex p-2 shadow-2xl">
        <button onclick="switchTab('roll')" id="nav-roll" class="flex-1 flex flex-col items-center py-2 text-amber-500">
            <span class="text-xl">🎲</span>
            <span class="text-[9px] font-bold uppercase mt-1">Roll</span>
        </button>
        <button onclick="switchTab('inv')" id="nav-inv" class="flex-1 flex flex-col items-center py-2 text-gray-500">
            <span class="text-xl">📦</span>
            <span class="text-[9px] font-bold uppercase mt-1">Stash</span>
        </button>
        <button onclick="switchTab('shop')" id="nav-shop" class="flex-1 flex flex-col items-center py-2 text-gray-500">
            <span class="text-xl">💰</span>
            <span class="text-[9px] font-bold uppercase mt-1">Shop</span>
        </button>
    </nav>

    <script>
        // --- ORIGINAL GAME LOGIC ---
        let bits = 0;
        let luck = 1.0;
        let upgradeCost = 50;
        let inventory = [];

        const bitsText = document.getElementById('bits');
        const luckTag = document.getElementById('luck-tag');
        const invList = document.getElementById('inv-list');

        // Click Logic
        document.getElementById('main-cookie').onclick = () => {
            bits += 1;
            updateDisplay();
        };

        // Roll Logic
        document.getElementById('roll-button').onclick = () => {
            const roll = Math.random() / luck;
            let cookie = { name: "Basic Cookie", rarity: "Common", color: "#8b4513" };

            if (roll < 0.001) cookie = { name: "CHRONO COOKIE", rarity: "DIVINE", color: "#06b6d4" };
            else if (roll < 0.02) cookie = { name: "Golden Crumb", rarity: "Rare", color: "#fbbf24" };
            else if (roll < 0.1) cookie = { name: "Sugar Cookie", rarity: "Uncommon", color: "#ffffff" };

            inventory.unshift(cookie);
            alert(`You found: ${cookie.name}!`);
            renderInventory();
        };

        // Shop Logic
        window.buyUpgrade = () => {
            if (bits >= upgradeCost) {
                bits -= upgradeCost;
                luck += 0.5;
                upgradeCost = Math.floor(upgradeCost * 2.2);
                updateDisplay();
                document.getElementById('upgrade-cost').innerText = upgradeCost + " BITS";
            } else {
                alert("Not enough bits!");
            }
        };

        // Navigation
        window.switchTab = (tab) => {
            ['roll', 'inv', 'shop'].forEach(t => {
                document.getElementById('tab-' + t).classList.add('hidden');
                document.getElementById('nav-' + t).classList.replace('text-amber-500', 'text-gray-500');
            });
            document.getElementById('tab-' + tab).classList.remove('hidden');
            document.getElementById('nav-' + tab).classList.replace('text-gray-500', 'text-amber-500');
        };

        function updateDisplay() {
            bitsText.innerText = Math.floor(bits);
            luckTag.innerText = `LUCK: ${luck.toFixed(1)}x`;
        }

        function renderInventory() {
            invList.innerHTML = '';
            inventory.forEach(item => {
                const div = document.createElement('div');
                div.className = `bg-[#181818] p-4 rounded-xl border-l-4 rarity-card flex justify-between items-center ${item.rarity === 'DIVINE' ? 'divine-glow' : ''}`;
                div.style.borderColor = item.color;
                div.innerHTML = `
                    <span class="font-bold text-sm">${item.name}</span>
                    <span class="text-[8px] font-black uppercase px-2 py-1 rounded bg-black/40" style="color:${item.color}">${item.rarity}</span>
                `;
                invList.appendChild(div);
            });
            updateDisplay();
        }
    </script>
</body>
</html>
