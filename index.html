<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cookie Clicker: Infinite Crumb</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0a0a; color: white; font-family: sans-serif; -webkit-tap-highlight-color: transparent; overflow: hidden; }
        .cookie-active:active { transform: scale(0.85); }
        .stats-panel { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="flex flex-col min-h-screen items-center justify-between p-6">

    <div class="w-full max-w-md stats-panel rounded-3xl p-6 text-center shadow-2xl">
        <h1 class="text-amber-500 font-black tracking-widest text-sm mb-1 uppercase">Total Bits</h1>
        <div id="bit-display" class="text-5xl font-mono font-bold">0</div>
        <div class="flex justify-around mt-4 text-[10px] font-bold text-gray-500 uppercase tracking-tighter">
            <span>Per Click: <span id="click-power-text" class="text-white">1</span></span>
            <span>Auto-Click: <span id="auto-power-text" class="text-white">0</span>/s</span>
        </div>
    </div>

    <div class="flex-grow flex items-center justify-center">
        <div id="cookie" class="text-[180px] cursor-pointer select-none transition-transform cookie-active drop-shadow-[0_0_50px_rgba(245,158,11,0.2)]">
            🍪
        </div>
    </div>

    <div class="w-full max-w-md space-y-3 mb-4">
        <h2 class="text-[10px] font-black text-gray-600 uppercase ml-2">Shop Upgrades</h2>
        
        <button onclick="buyClick()" class="w-full bg-[#111] border border-white/10 p-4 rounded-2xl flex justify-between items-center active:bg-zinc-800">
            <div class="text-left">
                <div class="font-bold text-amber-500 text-sm">Stronger Fingers</div>
                <div class="text-[10px] text-gray-500">+1 per click</div>
            </div>
            <div id="click-cost" class="bg-amber-600 px-4 py-2 rounded-xl font-black text-xs">15 Bits</div>
        </button>

        <button onclick="buyAuto()" class="w-full bg-[#111] border border-white/10 p-4 rounded-2xl flex justify-between items-center active:bg-zinc-800">
            <div class="text-left">
                <div class="font-bold text-amber-500 text-sm">Auto-Baker</div>
                <div class="text-[10px] text-gray-500">+1 bit per second</div>
            </div>
            <div id="auto-cost" class="bg-amber-600 px-4 py-2 rounded-xl font-black text-xs">100 Bits</div>
        </button>
    </div>

    <script>
        // --- GAME STATE ---
        let bits = 0;
        let clickPower = 1;
        let autoPower = 0;
        let clickCost = 15;
        let autoCost = 100;

        // --- ELEMENTS ---
        const bitDisplay = document.getElementById('bit-display');
        const clickCostText = document.getElementById('click-cost');
        const autoCostText = document.getElementById('auto-cost');
        const clickPowerText = document.getElementById('click-power-text');
        const autoPowerText = document.getElementById('auto-power-text');

        // --- CLICK ACTION ---
        document.getElementById('cookie').onclick = () => {
            bits += clickPower;
            updateUI();
        };

        // --- SHOP LOGIC ---
        function buyClick() {
            if (bits >= clickCost) {
                bits -= clickCost;
                clickPower += 1;
                clickCost = Math.floor(clickCost * 1.5);
                updateUI();
            }
        }

        function buyAuto() {
            if (bits >= autoCost) {
                bits -= autoCost;
                autoPower += 1;
                autoCost = Math.floor(autoCost * 1.8);
                updateUI();
            }
        }

        // --- TICKER (AUTO CLICKER) ---
        setInterval(() => {
            if (autoPower > 0) {
                bits += autoPower;
                updateUI();
            }
        }, 1000);

        // --- REFRESH SCREEN ---
        function updateUI() {
            bitDisplay.innerText = Math.floor(bits);
            clickCostText.innerText = clickCost + " Bits";
            autoCostText.innerText = autoCost + " Bits";
            clickPowerText.innerText = clickPower;
            autoPowerText.innerText = autoPower;
        }
    </script>
</body>
</html>
