<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>Cookie RNG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* PREVENT ZOOM AND BOUNCE */
        * {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }
        body {
            background-color: #09090b;
            overscroll-behavior: none;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        @keyframes slideIn { from { transform: translateY(-8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-item { animation: slideIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="text-white p-6 font-sans">

    <div class="max-w-md mx-auto space-y-8 pt-8">
        <div class="text-center space-y-2">
            <h1 class="text-4xl font-black italic tracking-tighter text-amber-500 uppercase">Cookie RNG</h1>
            <div class="flex justify-center gap-4 text-sm font-mono text-zinc-500">
                <span>BITS: <span id="bits-display" class="text-white">0</span></span>
                <span>LUCK: <span id="luck-display" class="text-white">1.0</span>x</span>
            </div>
        </div>

        <div id="cookie-btn" class="aspect-square flex items-center justify-center text-9xl cursor-pointer hover:scale-105 active:scale-95 transition-transform">
            🍪
        </div>

        <div class="grid grid-cols-2 gap-4">
            <button onclick="roll()" class="bg-amber-600 hover:bg-amber-500 p-4 rounded-2xl font-bold flex flex-col items-center gap-2">
                <i data-lucide="sparkles"></i>
                SUMMON
            </button>
            <button onclick="buyLuck()" class="bg-zinc-900 hover:bg-zinc-800 p-4 rounded-2xl font-bold flex flex-col items-center gap-2 border border-zinc-800 text-sm">
                <i data-lucide="shopping-bag"></i>
                <div class="flex flex-col items-center">
                    <span>LUCK UP</span>
                    <span id="cost-display" class="text-[10px] text-zinc-500 uppercase">50 BITS</span>
                </div>
            </button>
        </div>

        <div class="space-y-4 overflow-y-auto max-h-[30vh]">
            <h2 class="text-xs font-black text-zinc-500 uppercase tracking-widest flex items-center gap-2">
                <i data-lucide="trophy" size="14"></i> Recent Stash
            </h2>
            <div id="inventory-list" class="space-y-2 pb-10">
                </div>
        </div>
    </div>

    <script>
        let bits = 0;
        let luck = 1.0;
        let inventory = [];

        const COOKIES = [
            { name: "Chrono Cookie", rarity: "Divine", chance: 1/1000, color: "text-cyan-400" },
            { name: "Golden Cookie", rarity: "Rare", chance: 1/100, color: "text-yellow-400" },
            { name: "Sugar Cookie", rarity: "Uncommon", chance: 1/20, color: "text-blue-300" },
            { name: "Classic Cookie", rarity: "Common", chance: 1, color: "text-amber-700" }
        ];

        const bitsDisplay = document.getElementById('bits-display');
        const luckDisplay = document.getElementById('luck-display');
        const costDisplay = document.getElementById('cost-display');
        const invList = document.getElementById('inventory-list');

        lucide.createIcons();

        document.getElementById('cookie-btn').onclick = (e) => {
            e.preventDefault();
            bits++;
            updateUI();
        };

        function roll() {
            const r = Math.random() / luck;
            const found = COOKIES.find(c => r <= c.chance) || COOKIES[COOKIES.length - 1];
            inventory.unshift(found);
            if (inventory.length > 10) inventory.pop();
            updateInventory();
        }

        function buyLuck() {
            const cost = Math.floor(50 * Math.pow(1.5, (luck - 1) * 2));
            if (bits >= cost) {
                bits -= cost;
                luck += 0.5;
                updateUI();
            }
        }

        function updateUI() {
            bitsDisplay.innerText = bits;
            luckDisplay.innerText = luck.toFixed(1);
            const cost = Math.floor(50 * Math.pow(1.5, (luck - 1) * 2));
            costDisplay.innerText = `${cost} BITS`;
        }

        function updateInventory() {
            invList.innerHTML = '';
            inventory.forEach(item => {
                const div = document.createElement('div');
                div.className = "bg-zinc-900 p-4 rounded-xl border border-zinc-800 animate-item flex justify-between items-center";
                div.innerHTML = `
                    <span class="font-bold text-sm">${item.name}</span>
                    <span class="text-[10px] font-black uppercase ${item.color}">${item.rarity}</span>
                `;
                invList.appendChild(div);
            });
        }
    </script>
</body>
</html>
