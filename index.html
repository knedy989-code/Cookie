<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cookie RNG: Infinite Crumb</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0a0a; color: white; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        .cookie-click:active { transform: scale(0.8) rotate(5deg); }
        .tab-active { color: #f59e0b; border-bottom: 2px solid #f59e0b; }
        @keyframes slideIn { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-item { animation: slideIn 0.2s ease-out forwards; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <div class="p-5 bg-[#111] border-b border-white/5 flex justify-between items-center shadow-lg">
        <div>
            <h1 class="text-xl font-black text-amber-500 tracking-tighter uppercase">Infinite Crumb</h1>
            <p class="text-[10px] text-gray-500 font-mono">Bits: <span id="bits-count" class="text-white font-bold">0</span></p>
        </div>
        <div id="luck-stat" class="bg-amber-900/30 border border-amber-500/50 px-3 py-1 rounded text-[10px] font-black text-amber-400">
            LUCK: 1.0x
        </div>
    </div>

    <main id="view-roll" class="flex-grow flex flex-col items-center justify-center p-6">
        <div id="cookie-main" class="text-[140px] cursor-pointer select-none transition-transform cookie-click mb-10">🍪</div>
        <button id="btn-roll" class="w-full max-w-xs bg-amber-600 hover:bg-amber-500 text-white font-black py-4 rounded-xl shadow-lg transition-all active:translate-y-1">SUMMON (FREE)</button>
    </main>

    <main id="view-inv" class="hidden flex-grow p-6 overflow-y-auto">
        <h2 class="text-2xl font-black mb-4 uppercase text-gray-400">Stash</h2>
        <div id="inv-list" class="grid grid-cols-1 gap-2"></div>
    </main>

    <main id="view-shop" class="hidden flex-grow p-6">
        <h2 class="text-2xl font-black mb-4 uppercase text-gray-400">Upgrades</h2>
        <div onclick="buyLuck()" class="bg-white/5 p-4 rounded-xl border border-white/5 flex justify-between items-center active:bg-white/10">
            <div>
                <h3 class="font-bold text-sm text-amber-500">Magic Flour</h3>
                <p class="text-[10px] text-gray-400">Boosts luck +0.5x</p>
            </div>
            <button id="luck-cost" class="bg-amber-700 px-3 py-2 rounded font-bold text-[10px]">50 BITS</button>
        </div>
    </main>

    <nav class="bg-[#111] border-t border-white/5 p-2 flex text-gray-500">
        <button onclick="showTab('roll')" id="nav-roll" class="flex-1 flex flex-col items-center py-2 tab-active text-amber-500">
            <span class="text-lg">🍪</span><span class="text-[9px] font-bold mt-1 uppercase">Roll</span>
        </button>
        <button onclick="showTab('inv')" id="nav-inv" class="flex-1 flex flex-col items-center py-2">
            <span class="text-lg">📦</span><span class="text-[9px] font-bold mt-1 uppercase">Stash</span>
        </button>
        <button onclick="showTab('shop')" id="nav-shop" class="flex-1 flex flex-col items-center py-2">
            <span class="text-lg">💰</span><span class="text-[9px] font-bold mt-1 uppercase">Shop</span>
        </button>
    </nav>

    <script>
        let bits = 0, luck = 1.0, luckCost = 50, inventory = [];

        document.getElementById('cookie-main').onclick = () => { bits += 1; updateUI(); };

        document.getElementById('btn-roll').onclick = () => {
            const chance = Math.random() / luck;
            let res = { name: "Classic Cookie", rarity: "Common", color: "#8b4513" };
            if (chance < 0.005) res = { name: "CHRONO COOKIE", rarity: "DIVINE", color: "#06b6d4" };
            else if (chance < 0.05) res = { name: "Golden Leaf", rarity: "Rare", color: "#fbbf24" };
            else if (chance < 0.2) res = { name: "Sugar Frost", rarity: "Uncommon", color: "#fff" };
            inventory.unshift(res);
            updateInventory();
            alert(`Summoned: ${res.name}!`);
        };

        function buyLuck() {
            if (bits >= luckCost) { bits -= luckCost; luck += 0.5; luckCost = Math.floor(luckCost * 2.5); updateUI(); }
        }

        function showTab(tab) {
            ['roll', 'inv', 'shop'].forEach(t => {
                document.getElementById('view-'+t).classList.add('hidden');
                document.getElementById('nav-'+t).classList.remove('tab-active', 'text-amber-500');
            });
            document.getElementById('view-'+tab).classList.remove('hidden');
            document.getElementById('nav-'+tab).classList.add('tab-active', 'text-amber-500');
        }

        function updateUI() {
            document.getElementById('bits-count').innerText = Math.floor(bits);
            document.getElementById('luck-stat').innerText = `LUCK: ${luck.toFixed(1)}x`;
            document.getElementById('luck-cost').innerText = `${luckCost} BITS`;
        }

        function updateInventory() {
            const list = document.getElementById('inv-list');
            list.innerHTML = '';
            inventory.forEach(item => {
                const el = document.createElement('div');
                el.className = "bg-white/5 p-3 rounded-lg border-l-4 animate-item flex justify-between items-center";
                el.style.borderColor = item.color;
                el.innerHTML = `<span class="font-bold text-xs">${item.name}</span><span class="text-[8px] font-black uppercase px-2 py-1 rounded bg-black/40" style="color:${item.color}">${item.rarity}</span>`;
                list.appendChild(el);
            });
            updateUI();
        }
    </script>
</body>
</html>
