<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cookie RNG: Infinite Crumb</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0a0a; color: white; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        .cookie-click:active { transform: scale(0.85) rotate(5deg); }
        .rarity-glow { filter: drop-shadow(0 0 15px currentColor); }
        .tab-active { color: #f59e0b; border-bottom: 2px solid #f59e0b; background: rgba(245, 158, 11, 0.05); }
        @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-item { animation: slideIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <div class="p-5 bg-[#111] border-b border-white/5 flex justify-between items-center shadow-lg">
        <div>
            <h1 class="text-xl font-black tracking-tighter text-amber-500">COOKIE RNG</h1>
            <div class="flex items-center gap-2">
                <span class="text-[10px] text-gray-500 font-mono uppercase tracking-widest">Balance:</span>
                <span id="bits-count" class="text-lg font-mono font-bold text-white">0</span>
            </div>
        </div>
        <div id="luck-stat" class="bg-amber-900/30 border border-amber-500/50 px-3 py-1 rounded-lg text-[10px] font-black text-amber-400">
            LUCK: 1.0x
        </div>
    </div>

    <main id="view-roll" class="flex-grow flex flex-col items-center justify-center p-6">
        <div id="cookie-main" class="text-[150px] cursor-pointer select-none transition-transform cookie-click mb-12 drop-shadow-[0_0_30px_rgba(251,191,36,0.1)]">
            🍪
        </div>
        <button id="btn-roll" class="w-full max-w-xs bg-gradient-to-b from-amber-500 to-amber-700 hover:from-amber-400 hover:to-amber-600 text-white font-black py-4 rounded-2xl shadow-xl transition-all active:translate-y-1">
            SUMMON COOKIE
        </button>
        <p class="mt-4 text-[10px] text-gray-600 uppercase tracking-widest font-bold">Costs 0 Bits</p>
    </main>

    <main id="view-inv" class="hidden flex-grow p-6 overflow-y-auto">
        <div class="flex justify-between items-end mb-6">
            <h2 class="text-3xl font-black tracking-tight">STASH</h2>
            <span id="inv-count" class="text-xs text-gray-500 font-mono">0 Items</span>
        </div>
        <div id="inv-list" class="grid grid-cols-1 gap-3">
            </div>
    </main>

    <main id="view-shop" class="hidden flex-grow p-6">
        <h2 class="text-3xl font-black mb-6">UPGRADES</h2>
        <div class="space-y-4">
            <div onclick="buyLuck()" class="bg-[#1a1a1a] p-5 rounded-2xl border border-white/5 flex justify-between items-center active:bg-zinc-800">
                <div>
                    <h3 class="font-bold">Magic Flour</h3>
                    <p class="text-xs text-gray-500">Increases Luck by +0.5x</p>
                </div>
                <button id="luck-cost" class="bg-amber-600 px-4 py-2 rounded-lg font-bold text-xs">50 Bits</button>
            </div>
        </div>
    </main>

    <nav class="bg-[#111] border-t border-white/5 p-2 flex">
        <button onclick="showTab('roll')" id="nav-roll" class="flex-1 flex flex-col items-center py-2 tab-active transition-all">
            <span class="text-lg">🎲</span>
            <span class="text-[9px] font-bold mt-1 uppercase tracking-tighter">Roll</span>
        </button>
        <button onclick="showTab('inv')" id="nav-inv" class="flex-1 flex flex-col items-center py-2 text-gray-500 transition-all">
            <span class="text-lg">📦</span>
            <span class="text-[9px] font-bold mt-1 uppercase tracking-tighter">Inventory</span>
        </button>
        <button onclick="showTab('shop')" id="nav-shop" class="flex-1 flex flex-col items-center py-2 text-gray-500 transition-all">
            <span class="text-lg">💰</span>
            <span class="text-[9px] font-bold mt-1 uppercase tracking-tighter">Shop</span>
        </button>
    </nav>

    <script>
        // --- GAME STATE ---
        let bits = 0;
        let luck = 1.0;
        let luckCost = 50;
        let inventory = [];

        // --- DOM ELEMENTS ---
        const bitsDisplay = document.getElementById('bits-count');
        const invList = document.getElementById('inv-list');
        const luckStat = document.getElementById('luck-stat');
        const luckCostBtn = document.getElementById('luck-cost');

        // --- CORE FUNCTIONS ---
        document.getElementById('cookie-main').onclick = () => {
            bits += 1;
            updateUI();
        };

        document.getElementById('btn-roll').onclick = () => {
            const roll = Math.random() / luck;
            let result = { name: "Burnt Cookie", rarity: "Common", color: "#444" };

            if (roll < 0.005) result = { name: "CHRONO COOKIE", rarity: "DIVINE", color: "#06b6d4" };
            else if (roll < 0.05) result = { name: "Golden Chip", rarity: "Rare", color: "#fbbf24" };
            else if (roll < 0.2) result = { name: "Sugar Frost", rarity: "Uncommon", color: "#fff" };
            else result = { name: "Classic Cookie", rarity: "Common", color: "#8b4513" };

            inventory.unshift(result);
            alert(`ROLLED: ${result.name} (${result.rarity})`);
            updateInventory();
        };

        function buyLuck() {
            if (bits >= luckCost) {
                bits -= luckCost;
                luck += 0.5;
                luckCost = Math.floor(luckCost * 2.5);
                updateUI();
            } else {
                alert("Not enough bits!");
            }
        }

        // --- UI LOGIC ---
        function showTab(tab) {
            ['roll', 'inv', 'shop'].forEach(t => {
                document.getElementById(`view-${t}`).classList.add('hidden');
                document.getElementById(`nav-${t}`).classList.remove('tab-active', 'text-amber-500');
                document.getElementById(`nav-${t}`).classList.add('text-gray-500');
            });
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            document.getElementById(`nav-${tab}`).classList.add('tab-active');
        }

        function updateUI() {
            bitsDisplay.innerText = Math.floor(bits);
            luckStat.innerText = `LUCK: ${luck.toFixed(1)}x`;
            luckCostBtn.innerText = `${luckCost} Bits`;
            document.getElementById('inv-count').innerText = `${inventory.length} Items`;
        }

        function updateInventory() {
            invList.innerHTML = '';
            inventory.forEach(item => {
                const el = document.createElement('div');
                el.className = "bg-[#1a1a1a] p-4 rounded-xl border-l-4 animate-item flex justify-between items-center";
                el.style.borderColor = item.color;
                el.innerHTML = `
                    <span class="font-bold text-sm">${item.name}</span>
                    <span class="text-[8px] font-black px-2 py-1 rounded bg-black/50" style="color:${item.color}">${item.rarity}</span>
                `;
                invList.appendChild(el);
            });
            updateUI();
        }
    </script>
</body>
</html>
